name: DevOps Control Center CI

on:
  push:
  pull_request:

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest -v

      - name: Build Docker image
        run: docker build -t devops-control-center .

      - name: Run container
        run: docker run -d --name control-center -p 5000:5000 devops-control-center

      - name: Verify health endpoint
        run: |
          for i in $(seq 1 15); do
            if curl --fail http://127.0.0.1:5000/health; then
              exit 0
            fi
            sleep 2
          done
          docker logs control-center
          exit 1
